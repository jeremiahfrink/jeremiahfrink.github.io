  {label:'Sunday 2',foundation:'Weekend Mobility',fTime:'20–25 min',workoutKey:'longBike',workout:'Long Bike / Adventure',wTarget:'75–105 min',intent:'Long low-impact aerobic day'},
  {label:'Monday 2',foundation:'Core B',fTime:'15–20 min',workoutKey:'strengthB',workout:'Strength B',wTarget:'35–45 min',intent:'Full-body strength'},
  {label:'Tuesday 2',foundation:'Mobility A',fTime:'12–15 min',workoutKey:'qualityRun',workout:'Quality Run',wTarget:'3–4 miles total',intent:'Controlled hills/tempo or easy'},
  {label:'Wednesday 2',foundation:'Core A',fTime:'15–20 min',workoutKey:'strengthA',workout:'Strength A',wTarget:'35–45 min',intent:'Full-body strength'},
  {label:'Thursday 2',foundation:'Mobility B',fTime:'~15 min',workoutKey:'flexAerobic',workout:'Easy Run OR Bike',wTarget:'3–4 mi / ~40 min',intent:'Choose based on legs and travel'},
  {label:'Friday 2',foundation:'Core B',fTime:'~15 min',workoutKey:'strengthB',workout:'Strength B',wTarget:'30–40 min',intent:'Controlled lower body before weekend'}
];
const snacks=[
  ex('Desk Reset','3–5 min','Walk 60 seconds; 8–10 squats; 5–6 standing hip-flexor reaches per side; 6–8 thoracic rotations per side; 8–10 wall slides or shoulder-blade squeezes.',[V.hipFlexor,V.wallSlides]),
  ex('Standing / Presenter Reset','3–5 min','Walk briskly 60–90 seconds; 10 calf raises; 8 ankle rocks per side; 6 reverse lunges or split-stance shifts per side; 5 gentle side reaches per side; reset shoulder position.',[V.ankleRock,V.sideReach]),
  ex('Quick Strength Reset','3–5 min','8–12 squats; 8–12 counter/wall push-ups; optional 20–30 second plank only if it is not a hard Core day; 10 calf raises; finish with easy walking.',V.squat)
];
const KEY='fitnessGuide14Day_2026_v2';
const LEGACY_KEYS=['fitnessGuide14Day_2026_v1'];
const defaultState={settings:{anchor:'2026-08-15'},logs:{}};
let state=load(); let selectedDate=localDateString(new Date()); let alternateEditorOpen=false; let alternateLibrary=null;
function blankLog(){return {foundation:false,workout:false,breaks:0,movementNA:false,feeling:'',duration:'',distance:'',note:'',sleepHours:'',snoozeMinutes:'',calories:'',waterOz:'',planId:'',planName:'',planVersion:'',foundationPlan:'',foundationVersion:'',scheduledWorkoutId:'',scheduledWorkoutName:'',scheduledWorkoutVersion:'',scheduledWorkoutTarget:'',actualWorkoutMode:'planned',actualWorkoutId:'',actualWorkoutName:'',actualWorkoutTarget:''}}
function normalizeLog(l={}){return {...blankLog(),...l,breaks:Number(l.breaks)||0,movementNA:!!l.movementNA,actualWorkoutMode:l.actualWorkoutMode==='alternate'?'alternate':'planned'}}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}}const x=raw?JSON.parse(raw):null;if(!x||!x.logs)return structuredClone(defaultState);const loaded={...defaultState,...x,settings:{...defaultState.settings,...x.settings},logs:Object.fromEntries(Object.entries(x.logs).map(([d,l])=>[d,normalizeLog(l)]))};if(loaded.settings.anchor==='2026-08-08' && Object.keys(loaded.logs).length===0)loaded.settings.anchor='2026-08-15';return loaded}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); const s=document.getElementById('saveStatus'); if(s){s.textContent='Saved locally';s.style.opacity='1';setTimeout(()=>s.style.opacity='.65',700)}}
function localDateString(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function fmtDate(s){return parseDate(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function cycleIndex(s){const a=Date.UTC(...state.settings.anchor.split('-').map((v,i)=>i===1?Number(v)-1:Number(v)));const d=Date.UTC(...s.split('-').map((v,i)=>i===1?Number(v)-1:Number(v)));const diff=Math.floor((d-a)/86400000);return ((diff%14)+14)%14}
function snapshotPlan(log,date){const i=cycleIndex(date),d=cycle[i];if(!log.planId){log.planId=PLAN.id;log.planName=PLAN.name;log.planVersion=PLAN.version;log.foundationPlan=d.foundation;log.foundationVersion=FOUNDATION_VERSION[d.foundation]||d.foundation;log.scheduledWorkoutId=d.workoutKey;log.scheduledWorkoutName=d.workout;log.scheduledWorkoutVersion=WORKOUT_VERSION[d.workoutKey]||d.workout;log.scheduledWorkoutTarget=d.wTarget;}if(!log.actualWorkoutName&&log.actualWorkoutMode!=='alternate'){log.actualWorkoutId=log.scheduledWorkoutId;log.actualWorkoutName=log.scheduledWorkoutName;log.actualWorkoutTarget=log.scheduledWorkoutTarget;}return log}
function logFor(s){if(!state.logs[s])state.logs[s]=blankLog();else state.logs[s]=normalizeLog(state.logs[s]);return snapshotPlan(state.logs[s],s)}
function actualWorkoutLabel(log){return log.actualWorkoutMode==='alternate'?(log.actualWorkoutName||'Alternate workout'):log.scheduledWorkoutName}
Object.entries(state.logs).forEach(([d,l])=>snapshotPlan(l,d));save();

function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function activityHTML(a){const vids=a.video.filter(Boolean);return `<details class="activity"><summary><span class="name">${esc(a.name)}</span><span class="dose">${esc(a.dose)}</span><span class="chev">›</span></summary><div class="detailsBody"><p>${esc(a.cue)}</p>${vids.map((u,i)=>`<a class="video" href="${u}" target="_blank" rel="noopener">${vids.length>1?'Video '+(i+1):'Watch video'}</a>`).join('')}</div></details>`}
function alternateEditorHTML(log){return `<div class="altEditor"><div class="altGrid"><div class="field wide"><label>Alternate workout</label><input id="altName" value="${esc(log.actualWorkoutMode==='alternate'?log.actualWorkoutName:'')}" placeholder="e.g. Row 30 min + Swim 20 min"></div><div class="field wide"><label>Target / duration</label><input id="altTarget" value="${esc(log.actualWorkoutMode==='alternate'?log.actualWorkoutTarget:'')}" placeholder="e.g. 50 min easy/moderate"></div></div><div class="choiceActions"><button class="primary" id="saveAlternate">Use This Workout</button><button class="secondary" id="browseAlternates">Browse Alternates</button><button class="secondary" id="cancelAlternate">Cancel</button></div><div id="alternateLibrary" class="library"></div></div>`}
async function loadAlternateLibrary(){const box=document.getElementById('alternateLibrary');if(!box)return;box.innerHTML='<div class="tiny">Loading alternates…</div>';try{if(!alternateLibrary){const r=await fetch('./workouts.json',{cache:'no-cache'});if(!r.ok)throw Error('load');alternateLibrary=await r.json()}box.innerHTML=alternateLibrary.workouts.map(w=>`<div class="libraryItem"><strong>${esc(w.name)}</strong><small>${esc(w.target||'')}</small><div class="tag">${esc(w.category||'alternate')}</div><p class="tiny">${esc(w.description||'')}</p><button class="choiceBtn" data-alt-id="${esc(w.id)}">Choose</button></div>`).join('');box.querySelectorAll('[data-alt-id]').forEach(b=>b.onclick=()=>{const w=alternateLibrary.workouts.find(x=>x.id===b.dataset.altId);document.getElementById('altName').value=w.name;document.getElementById('altTarget').value=w.target||'';document.getElementById('altName').dataset.libraryId=w.id})}catch(e){box.innerHTML='<div class="tiny">Could not load workouts.json. You can still type an alternate above.</div>'}}
function renderToday(){const idx=cycleIndex(selectedDate),day=cycle[idx],log=logFor(selectedDate);const foundation=foundations[day.foundation],work=workouts[day.workoutKey];const usingAlt=log.actualWorkoutMode==='alternate';
 document.getElementById('todayView').innerHTML=`
 <div class="datebar"><button id="prevDay">‹</button><div class="datecenter"><strong>${fmtDate(selectedDate)}</strong><span>Cycle day ${idx+1} of 14</span><button class="todaybtn" id="jumpToday">Go to today</button></div><button id="nextDay">›</button></div>
 <div class="hero"><div class="eyebrow">${day.label}</div><h2>${day.foundation} + ${day.workout}</h2><p>${day.intent}</p></div>
 <div class="section"><label class="sectionHead checkable"><input id="foundationDone" class="check" type="checkbox" ${log.foundation?'checked':''}><div><h3>Foundation <span class="required">Required</span></h3><small>${day.foundation} · ${day.fTime}</small></div></label>${foundation.map(activityHTML).join('')}<div class="miniNote">${day.foundation==='Weekend Mobility'?'Weekend Mobility begins with 5 minutes of easy movement before longer holds. Keep all stretches comfortable and avoid forcing range.':'Before a run, bike ride or strength session, keep mobility controlled and mostly dynamic. Longer static holds fit better after training or later in the day.'}</div></div>
 <div class="section"><label class="sectionHead checkable"><input id="workoutDone" class="check" type="checkbox" ${log.workout?'checked':''}><div><h3>Workout <span class="required">Required</span></h3><small>${usingAlt?esc(log.actualWorkoutName||'Alternate workout'):day.workout} · ${usingAlt?esc(log.actualWorkoutTarget||'custom'):day.wTarget}</small></div></label><div class="workoutChoice"><strong>${usingAlt?'Alternate workout':'Scheduled workout'} <span class="versionTag">${usingAlt?'':'· '+esc(log.scheduledWorkoutVersion)}</span></strong>${usingAlt?`<span>Originally scheduled: ${esc(log.scheduledWorkoutName)} · ${esc(log.scheduledWorkoutTarget)}</span>`:`<span>${esc(PLAN.name)} · ${esc(PLAN.version)}</span>`}<div class="choiceActions"><button class="choiceBtn ${usingAlt?'alt':''}" id="alternateBtn">${usingAlt?'Change Alternate':'Use Alternate'}</button>${usingAlt?'<button class="choiceBtn" id="plannedBtn">Use Planned</button>':''}</div></div>${alternateEditorOpen?alternateEditorHTML(log):''}${usingAlt?`<div class="miniNote"><strong>Actual workout:</strong> ${esc(log.actualWorkoutName||'Alternate workout')}${log.actualWorkoutTarget?' · '+esc(log.actualWorkoutTarget):''}</div>`:work.map(activityHTML).join('')}<div class="miniNote">For strength: generally finish most sets with about 2–3 good repetitions still possible. On Friday, reduce demanding leg volume if needed so Saturday stays strong.</div></div>
 <div class="section"><div class="sectionHead"><div><h3>Throughout the Day</h3><small>Log movement breaks, or mark the day not applicable</small></div></div><div class="breakrow"><div><strong>Movement breaks</strong><div class="tiny">Useful after roughly 60–120 minutes of prolonged sitting/standing, or whenever stiffness builds.</div></div><button id="notDeskBtn" class="deskToggle ${log.movementNA?'active':''}">No Desk Day</button><div class="counter"><button id="breakMinus" ${log.movementNA?'disabled':''}>−</button><span id="breakCount" class="count">${log.movementNA?'N/A':(log.breaks||0)}</span><button id="breakPlus" ${log.movementNA?'disabled':''}>+</button></div></div>${snacks.map(activityHTML).join('')}</div>
 <div class="section"><div class="sectionHead"><div><h3>Daily Health</h3><small>Optional context for sleep, snooze, food and hydration</small></div></div><div class="loggrid"><div class="field"><label>Sleep (hours)</label><input id="sleepHours" inputmode="decimal" type="number" min="0" max="24" step="0.1" value="${esc(log.sleepHours)}" placeholder="e.g. 7.5"></div><div class="field"><label>Snooze (minutes)</label><input id="snoozeMinutes" inputmode="numeric" type="number" min="0" step="1" value="${esc(log.snoozeMinutes)}" placeholder="e.g. 10"></div><div class="field"><label>Calories</label><input id="calories" inputmode="numeric" type="number" min="0" step="1" value="${esc(log.calories)}" placeholder="optional"></div><div class="field"><label>Water (oz)</label><input id="waterOz" inputmode="decimal" type="number" min="0" step="1" value="${esc(log.waterOz)}" placeholder="optional"></div></div><div class="miniNote">These are tracking fields only. They do not affect workout completion or score the day.</div></div>
 <div class="section"><div class="sectionHead"><div><h3>Quick Log</h3><small>Optional, but useful when reviewing patterns</small></div></div><div class="loggrid"><div class="field wide"><label>How did your body feel?</label><div class="feel">${['Good','Okay','Rough'].map(x=>`<button data-feel="${x}" class="${log.feeling===x?'active':''}">${x}</button>`).join('')}</div></div><div class="field"><label>Workout minutes</label><input id="duration" inputmode="numeric" value="${esc(log.duration)}" placeholder="e.g. 45"></div><div class="field"><label>Distance (miles)</label><input id="distance" inputmode="decimal" value="${esc(log.distance)}" placeholder="optional"></div><div class="field wide"><label>Quick note</label><textarea id="note" rows="3" placeholder="How did it go? Back/legs? Anything to change next cycle?">${esc(log.note)}</textarea></div></div></div>
 <details class="fallback"><summary>Crazy day? Use the Minimum Foundation</summary><p>About 10 minutes: 1 minute of Cat-Cow/Open Book movement, 2 sets of Dead Bug, 2 short front or side planks, 1 set of Glute Bridges, then 3–4 minutes of hip-flexor, hamstring, chest and upper-back mobility. Do this before bed rather than trying to double up tomorrow.</p></details>
 <div class="notice">Training guidance is general, not diagnosis or treatment. Stop a movement for sharp or escalating pain, radiating pain, numbness/tingling, new weakness, or an exercise that repeatedly aggravates your back.</div>`;
 bindToday();
}
function bindToday(){
 const changeDay=n=>{const d=parseDate(selectedDate);d.setDate(d.getDate()+n);selectedDate=localDateString(d);renderToday()};
 document.getElementById('prevDay').onclick=()=>changeDay(-1);document.getElementById('nextDay').onclick=()=>changeDay(1);document.getElementById('jumpToday').onclick=()=>{selectedDate=localDateString(new Date());renderToday()};
 const log=logFor(selectedDate);document.getElementById('foundationDone').onchange=e=>{log.foundation=e.target.checked;save()};document.getElementById('workoutDone').onchange=e=>{log.workout=e.target.checked;save()};
 document.getElementById('alternateBtn').onclick=()=>{alternateEditorOpen=!alternateEditorOpen;renderToday()};
 const plannedBtn=document.getElementById('plannedBtn');if(plannedBtn)plannedBtn.onclick=()=>{log.actualWorkoutMode='planned';log.actualWorkoutId=log.scheduledWorkoutId;log.actualWorkoutName=log.scheduledWorkoutName;log.actualWorkoutTarget=log.scheduledWorkoutTarget;alternateEditorOpen=false;save();renderToday()};
 const saveAlt=document.getElementById('saveAlternate');if(saveAlt)saveAlt.onclick=()=>{const n=document.getElementById('altName').value.trim();if(!n){alert('Give the alternate workout a short name.');return}log.actualWorkoutMode='alternate';log.actualWorkoutId=document.getElementById('altName').dataset.libraryId||'custom';log.actualWorkoutName=n;log.actualWorkoutTarget=document.getElementById('altTarget').value.trim();alternateEditorOpen=false;save();renderToday()};
 const browse=document.getElementById('browseAlternates');if(browse)browse.onclick=loadAlternateLibrary;const cancel=document.getElementById('cancelAlternate');if(cancel)cancel.onclick=()=>{alternateEditorOpen=false;renderToday()};
 document.getElementById('notDeskBtn').onclick=()=>{log.movementNA=!log.movementNA;if(log.movementNA)log.breaks=0;save();renderToday()};
 document.getElementById('breakMinus').onclick=()=>{if(log.movementNA)return;log.breaks=Math.max(0,(log.breaks||0)-1);document.getElementById('breakCount').textContent=log.breaks;save()};document.getElementById('breakPlus').onclick=()=>{log.movementNA=false;log.breaks=(log.breaks||0)+1;document.getElementById('breakCount').textContent=log.breaks;save()};
 document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{log.feeling=b.dataset.feel;save();renderToday()});
 ['duration','distance','note','sleepHours','snoozeMinutes','calories','waterOz'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{log[id]=e.target.value;save()}));
}
function renderPlan(){document.getElementById('planView').innerHTML=`<div class="hero"><div class="eyebrow">${PLAN.name} · ${PLAN.version}</div><h2>Repeat every 14 days</h2><p>Saturday is Day 1 by design. The cycle repeats after Friday 2. Scheduled workouts may be replaced with logged alternates without changing the underlying plan.</p></div>${cycle.map((d,i)=>`<div class="planCard"><div class="planTop"><strong>Day ${i+1}: ${d.label}</strong><span>${d.intent}</span></div><div class="planCols"><div class="pill"><b>Foundation</b>${d.foundation}<br>${d.fTime}</div><div class="pill"><b>Workout</b>${d.workout}<br>${d.wTarget}</div><div class="pill"><b>Throughout day</b>Movement breaks as needed</div></div></div>`).join('')}<div class="notice">The cycle matters more than exact calendar perfection. Do not double missed workouts. Resume the sequence or make a sensible swap while avoiding consecutive hard days on the same tissues.</div>`}
function renderHistory(){const entries=Object.entries(state.logs).map(([d,l])=>[d,normalizeLog(l)]).filter(([d,l])=>l.foundation||l.workout||l.breaks||l.movementNA||l.feeling||l.duration||l.distance||l.note||l.sleepHours||l.snoozeMinutes||l.calories||l.waterOz||l.actualWorkoutMode==='alternate').sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('historyView').innerHTML=`<div class="hero"><div class="eyebrow">Local history</div><h2>${entries.length} logged day${entries.length===1?'':'s'}</h2><p>Each logged day preserves the plan and workout version that was active at the time.</p></div>${entries.length?entries.map(([date,l0])=>{const l=snapshotPlan(l0,date);const d=cycle[cycleIndex(date)];const health=[l.sleepHours?`Sleep ${esc(l.sleepHours)} h`:'',l.snoozeMinutes!==''?`Snooze ${esc(l.snoozeMinutes)} min`:'',l.calories?`${esc(l.calories)} cal`:'',l.waterOz?`Water ${esc(l.waterOz)} oz`:''].filter(Boolean).join(' · ');return `<div class="historyItem"><div class="historyTop"><strong>${fmtDate(date)}</strong><span class="tiny">${esc(d.label)}</span></div><div class="marks">Foundation: ${l.foundation?'Done':'Not checked'} · Workout: ${l.workout?'Done':'Not checked'} · ${l.movementNA?'Movement: Not a Desk Day':'Breaks: '+(l.breaks||0)}${l.feeling?' · '+esc(l.feeling):''}${l.duration?' · '+esc(l.duration)+' min':''}${l.distance?' · '+esc(l.distance)+' mi':''}</div>${health?`<div class="tiny" style="margin-top:6px"><strong>Daily health:</strong> ${health}</div>`:''}<div class="tiny" style="margin-top:6px">${esc(l.planName)} · ${esc(l.planVersion)}<br>Scheduled: ${esc(l.scheduledWorkoutVersion||l.scheduledWorkoutName)}${l.actualWorkoutMode==='alternate'?`<br><strong>Actual: ${esc(l.actualWorkoutName)}</strong>${l.actualWorkoutTarget?' · '+esc(l.actualWorkoutTarget):''}`:''}</div>${l.note?`<p>${esc(l.note)}</p>`:''}</div>`}).join(''):'<div class="empty">No workout or health history yet.</div>'}`}
function renderData(){document.getElementById('dataView').innerHTML=`
 <div class="hero"><div class="eyebrow">Backup and analysis</div><h2>Your data belongs to you</h2><p>Workout completion, notes, movement breaks and optional daily-health metrics are stored only in this browser unless you export them.</p></div>
 <div class="dataCard"><h3>Export</h3><p>Use CSV for spreadsheets/analysis. Use JSON as a complete backup that can be imported later.</p><div class="actions"><button class="primary" id="csvBtn">Export CSV</button><button class="secondary" id="jsonBtn">Export JSON Backup</button></div></div>
 <div class="dataCard"><h3>Restore</h3><p>Import a JSON backup created by this app. Existing local logs will be replaced by the imported backup.</p><input id="importFile" type="file" accept="application/json" /></div>
 <div class="dataCard"><h3>Plan version</h3><p><strong>${PLAN.name} · ${PLAN.version}</strong><br>Logged days snapshot this version plus the scheduled and actual workout. The optional alternate-workout library lives in <code>workouts.json</code> and loads only when you tap Browse Alternates.</p></div>
 <div class="dataCard"><h3>Cycle start</h3><p>The app uses this Saturday as the anchor for the repeating 14-day sequence. Change it only if you intentionally restart the rhythm on a different Saturday.</p><div class="field"><label>Cycle anchor</label><input id="anchorDate" type="date" value="${state.settings.anchor}"></div></div>
 <div class="dataCard"><h3>Training references</h3><p>The plan uses current general guidance: dynamic movement before training, regular aerobic activity, and resistance training at least twice weekly. Individual back symptoms can require tailored advice.</p><div class="actions"><a class="video" target="_blank" rel="noopener" href="https://www.hss.edu/health-library/move-better/static-dynamic-stretching">HSS stretching</a><a class="video" target="_blank" rel="noopener" href="https://acsm.org/resistance-training-guidelines-update-2026/">ACSM strength</a><a class="video" target="_blank" rel="noopener" href="https://www.heart.org/en/healthy-living/exercise-and-physical-activity/fitness-basics/aha-recs-for-physical-activity-in-adults">AHA activity</a></div></div>
 <div class="dataCard"><h3>Local storage</h3><p>Clearing browser/site data can erase local history. Export a JSON backup periodically if you want to protect it.</p><button class="danger" id="clearBtn">Clear all local fitness data</button></div>`;
 document.getElementById('csvBtn').onclick=exportCSV;document.getElementById('jsonBtn').onclick=exportJSON;document.getElementById('anchorDate').onchange=e=>{if(parseDate(e.target.value).getDay()!==6){alert('The cycle anchor must be a Saturday.');e.target.value=state.settings.anchor;return;}state.settings.anchor=e.target.value;save();renderData()};document.getElementById('clearBtn').onclick=()=>{if(confirm('Clear all locally stored workout history and reset the cycle anchor?')){state=structuredClone(defaultState);save();renderData()}};
 document.getElementById('importFile').onchange=importJSON;
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){download(`fitness-backup-${localDateString(new Date())}.json`,JSON.stringify({version:4,exportedAt:new Date().toISOString(),...state},null,2),'application/json')}
function csvQ(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){const head=['date','cycle_day','cycle_label','plan_id','plan_name','plan_version','foundation_plan','foundation_version','scheduled_workout_id','scheduled_workout_name','scheduled_workout_version','scheduled_workout_target','actual_workout_mode','actual_workout_id','actual_workout_name','actual_workout_target','foundation_done','workout_done','movement_status','movement_breaks','sleep_hours','snooze_minutes','calories','water_oz','feeling','duration_minutes','distance_miles','note'];const lines=[head.join(',')];Object.entries(state.logs).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,l0])=>{const i=cycleIndex(date),d=cycle[i],l=snapshotPlan(normalizeLog(l0),date);lines.push([date,i+1,d.label,l.planId,l.planName,l.planVersion,l.foundationPlan,l.foundationVersion,l.scheduledWorkoutId,l.scheduledWorkoutName,l.scheduledWorkoutVersion,l.scheduledWorkoutTarget,l.actualWorkoutMode,l.actualWorkoutId,l.actualWorkoutName,l.actualWorkoutTarget,l.foundation?'yes':'no',l.workout?'yes':'no',l.movementNA?'not_desk_day':'tracked',l.movementNA?'':(l.breaks||0),l.sleepHours||'',l.snoozeMinutes!==''?l.snoozeMinutes:'',l.calories||'',l.waterOz||'',l.feeling||'',l.duration||'',l.distance||'',l.note||''].map(csvQ).join(','))});download(`fitness-history-${localDateString(new Date())}.csv`,lines.join('\n'),'text/csv')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.logs||!x.settings)throw Error();if(confirm('Replace local fitness history with this backup?')){state={settings:{...defaultState.settings,...x.settings},logs:Object.fromEntries(Object.entries(x.logs).map(([d,l])=>[d,normalizeLog(l)]))};save();renderData();alert('Backup restored.')}}catch(err){alert('That file does not look like a valid fitness-app backup.')}};r.readAsText(f)}
function show(view){['today','plan','history','data'].forEach(v=>{document.getElementById(v+'View').classList.toggle('hidden',v!==view);document.querySelector(`[data-view="${v}"]`).classList.toggle('active',v===view)});if(view==='today')renderToday();if(view==='plan')renderPlan();if(view==='history')renderHistory();if(view==='data')renderData();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
renderToday();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
