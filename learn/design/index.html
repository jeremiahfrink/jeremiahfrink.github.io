<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A guided design studio for creating a personal game-development workspace with AI as a co-designer." />
    <title>Game Space Design Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to the design activity</a>
    <div id="app" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="reset-dialog" class="dialog confirm-dialog">
      <h2>Start this design again?</h2>
      <p>This clears the notes saved by this page on this device. It does not affect the Gemini conversation.</p>
      <div class="dialog-actions">
        <button class="button secondary" data-close-reset>Keep my work</button>
        <button class="button danger" data-confirm-reset>Clear and restart</button>
      </div>
    </dialog>

    <script src="./app.js" defer></script>
  </body>
</html>
